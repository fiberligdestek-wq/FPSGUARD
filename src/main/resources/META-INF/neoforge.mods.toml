[[mods]]
modId = "fpsguard"
version = "1.2.0"
displayName = "FPS Guard"
authors = "Emir"
description = '''
Client-side performance helper. While focused: lowers render/simulation/entity distance when FPS, RAM or CPU is under pressure and restores them later.
While the window is in the background: sleep mode (low FPS cap, optional lower render distance, mute, minimal particles, skipped entity rendering, one GC request).
Everything is configurable in-game and original settings are always restored.
'''

[[dependencies.fpsguard]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.fpsguard]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "CLIENT"

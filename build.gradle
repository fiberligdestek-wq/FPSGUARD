plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.1.0'
group = 'com.fpsguard'

base {
    archivesName = 'fpsguard-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

neoForge {
    // Sürüm uyuşmazlığı olursa 21.1.x serisinden güncel bir sürüm yaz
    version = '21.1.172'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fpsguard'
        }
    }

    mods {
        fpsguard {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
